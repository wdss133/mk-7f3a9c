name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DOMAIN: ${{ secrets.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Frontend
        working-directory: ./mail-vue
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          ls -la ../mail-worker/dist/ | head -20

      - name: Base config
        working-directory: ./mail-worker
        run: |
          set -e
          cp wrangler-action.toml wrangler-diag.toml
          sed -i '/\[\[routes\]\]/,/^$/d' wrangler-diag.toml
          sed -i '/\[\[r2_buckets\]\]/,/^$/d' wrangler-diag.toml
          sed -i "s|\${NAME}|wk-diag|g" wrangler-diag.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-diag.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-diag.toml
          sed -i "s|\${PASSWORD}|${PASSWORD}|g" wrangler-diag.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-diag.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-diag.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-diag.toml
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" wrangler-diag.toml
          sed -i "s|\${ANALYSIS_CACHE}|false|g" wrangler-diag.toml
          sed -i "s|^project_link = .*|project_link = \"\"|g" wrangler-diag.toml
          python3 - <<'PY'
          p = 'wrangler-diag.toml'
          s = open(p).read()
          if 'nodejs_compat' not in s:
              s = s.replace('keep_vars = true', 'keep_vars = true\ncompatibility_flags = ["nodejs_compat"]', 1)
          open(p, 'w').write(s)
          PY
          sed -i '/\[build\]/,$d' wrangler-diag.toml

      - name: Probe bindings
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          cat > src/probe.js <<'JS'
          export class MailHub {
            constructor(state, env) { this.state = state; this.env = env; }
            async fetch() { return new Response('hub'); }
          }
          export default {
            async fetch(req, env) {
              const out = {
                path: new URL(req.url).pathname,
                assets: typeof env.assets,
                db: typeof env.db,
                kv: typeof env.kv,
                ai: typeof env.ai,
                r2: typeof env.r2,
                forward: typeof env.forward,
                hasAssetsBinding: !!env.assets,
              };
              return new Response(JSON.stringify(out, null, 2), {
                status: 200,
                headers: { 'content-type': 'application/json; charset=utf-8' }
              });
            }
          };
          JS
          sed 's|main = "src/index.js"|main = "src/probe.js"|' wrangler-diag.toml > wrangler-probe.toml
          pnpm wrangler deploy -c wrangler-probe.toml > deploy-probe.log 2>&1
          grep -E "env\.|Uploaded|ERROR" deploy-probe.log | head -20
          sleep 10
          B="https://wk-diag.2997875227.workers.dev"
          echo "=== /api/probe (bindings) ==="
          curl -s -w "\nstatus=%{http_code}\n" --max-time 30 "$B/api/probe" | head -c 800
          echo "=== /index.html ==="
          curl -s -o /tmp/ih -w "status=%{http_code}\n" --max-time 30 "$B/index.html"
          head -c 120 /tmp/ih; echo
          echo "=== / ==="
          curl -s -o /tmp/root -w "status=%{http_code}\n" --max-time 30 "$B/"
          head -c 200 /tmp/root; echo

      - name: Probe import only
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          cat > src/importonly.js <<'JS'
          import './index.js';
          import { MailHub } from './websocket/hub';
          export { MailHub };
          export default {
            fetch() {
              return new Response('IMPORT-OK', { status: 200 });
            }
          };
          JS
          sed 's|main = "src/index.js"|main = "src/importonly.js"|' wrangler-diag.toml > wrangler-imp.toml
          pnpm wrangler deploy -c wrangler-imp.toml > deploy-imp.log 2>&1
          tail -5 deploy-imp.log
          sleep 10
          B="https://wk-diag.2997875227.workers.dev"
          echo "=== /api/probe (import only) ==="
          curl -s -w "\nstatus=%{http_code}\n" --max-time 30 "$B/api/probe" | head -c 800