name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DOMAIN: ${{ secrets.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Frontend
        working-directory: ./mail-vue
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Bisect bindings
        working-directory: ./mail-worker
        run: |
          cat > src/bare.js <<'JS'
          export class MailHub {
            constructor(state, env) { this.state = state; this.env = env; }
            async fetch() { return new Response('hub'); }
          }
          export default {
            async fetch(req, env) {
              return new Response('BARE-OK ' + new URL(req.url).pathname, { status: 200 });
            }
          };
          JS

          make_base() {
            cat > "wrangler-b$1.toml" <<EOF
          name = "wk-b$1"
          main = "src/bare.js"
          compatibility_date = "2025-06-04"
          compatibility_flags = ["nodejs_compat"]
          EOF
          }

          make_base 0

          make_base 1
          cat >> wrangler-b1.toml <<'EOF'
          [assets]
          binding = "assets"
          directory = "./dist"
          not_found_handling = "single-page-application"
          run_worker_first = ["/api/*"]
          EOF

          make_base 2
          cat >> wrangler-b2.toml <<EOF
          [[d1_databases]]
          binding = "db"
          database_name = "mk-7f3a9c"
          database_id = "${D1_DATABASE_ID}"

          [[kv_namespaces]]
          binding = "kv"
          id = "${KV_NAMESPACE_ID}"
          EOF

          make_base 3
          cat >> wrangler-b3.toml <<'EOF'
          [[durable_objects.bindings]]
          name = "ws"
          class_name = "MailHub"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MailHub"]
          EOF

          make_base 4
          cat >> wrangler-b4.toml <<'EOF'
          [ai]
          binding = "ai"
          EOF

          for i in 0 1 2 3 4; do
            echo "===== deploy wk-b$i ====="
            pnpm wrangler deploy -c "wrangler-b$i.toml" 2>&1 | grep -E "env\.|Uploaded|ERROR|✘" | head -8 || true
          done

          sleep 15
          for i in 0 1 2 3 4; do
            echo "===== curl wk-b$i ====="
            curl -s -w "\nstatus=%{http_code}\n" --max-time 25 "https://wk-b$i.2997875227.workers.dev/api/x" | head -c 300
            echo
          done