name: diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DOMAIN: ${{ secrets.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Frontend
        working-directory: ./mail-vue
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Base config
        working-directory: ./mail-worker
        run: |
          set -e
          cp wrangler-action.toml wrangler-diag.toml
          sed -i '/\[\[routes\]\]/,/^$/d' wrangler-diag.toml
          sed -i '/\[\[r2_buckets\]\]/,/^$/d' wrangler-diag.toml
          sed -i "s|\${NAME}|wk-diag|g" wrangler-diag.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-diag.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-diag.toml
          sed -i "s|\${PASSWORD}|${PASSWORD}|g" wrangler-diag.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-diag.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-diag.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-diag.toml
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" wrangler-diag.toml
          sed -i "s|\${ANALYSIS_CACHE}|false|g" wrangler-diag.toml
          sed -i "s|^project_link = .*|project_link = \"\"|g" wrangler-diag.toml
          python3 - <<'PY'
          p = 'wrangler-diag.toml'
          s = open(p).read()
          if 'nodejs_compat' not in s:
              s = s.replace('keep_vars = true', 'keep_vars = true\ncompatibility_flags = ["nodejs_compat"]', 1)
          open(p, 'w').write(s)
          PY
          sed -i '/\[build\]/,$d' wrangler-diag.toml

      - name: Minimal worker
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          cat > src/mini.js <<'JS'
          export class MailHub {
            constructor(state, env) { this.state = state; this.env = env; }
            async fetch() { return new Response('hub'); }
          }
          export default {
            fetch() {
              return new Response('ALIVE-OK', { status: 200 });
            }
          };
          JS
          sed 's|main = "src/index.js"|main = "src/mini.js"|' wrangler-diag.toml > wrangler-mini.toml
          pnpm wrangler deploy -c wrangler-mini.toml
          sleep 10
          echo "--- mini ---"
          curl -s -w "\nstatus=%{http_code}\n" --max-time 30 "https://wk-diag.2997875227.workers.dev/" | head -c 800

      - name: App wrapper
        continue-on-error: true
        working-directory: ./mail-worker
        run: |
          cat > src/diag.js <<'JS'
          import worker from './index.js';
          import { MailHub } from './websocket/hub';

          export { MailHub };

          function describe(e) {
            if (!e) return 'empty error';
            let out = '';
            try {
              out = (e.stack || e.message || String(e));
              if (e.cause) out += '\nCAUSE: ' + describe(e.cause);
            } catch (_) {
              out = String(e);
            }
            return out;
          }

          export default {
            async fetch(req, env, ctx) {
              try {
                return await worker.fetch(req, env, ctx);
              } catch (e) {
                return new Response('DIAG-START\n' + describe(e) + '\nDIAG-END', {
                  status: 200,
                  headers: { 'content-type': 'text/plain; charset=utf-8' }
                });
              }
            },
            email: worker.email,
            scheduled: worker.scheduled
          };
          JS
          sed 's|main = "src/index.js"|main = "src/diag.js"|' wrangler-diag.toml > wrangler-app.toml
          pnpm wrangler deploy -c wrangler-app.toml
          sleep 10
          echo "--- app / ---"
          curl -s -w "\nstatus=%{http_code}\n" --max-time 40 "https://wk-diag.2997875227.workers.dev/" | head -c 5000
          echo
          echo "--- app /api/init ---"
          curl -s -w "\nstatus=%{http_code}\n" --max-time 60 "https://wk-diag.2997875227.workers.dev/api/init/${JWT_SECRET}" | head -c 5000