name: alt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-alt.yml"

concurrency:
  group: alt
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NAME: ${{ secrets.ALT_NAME }}
      DOMAIN: ${{ secrets.ALT_DOMAIN }}
      ADMIN: ${{ secrets.ALT_ADMIN }}
      PASSWORD: ${{ secrets.ALT_PASSWORD }}
      JWT_SECRET: ${{ secrets.ALT_JWT_SECRET }}
      AI_MODEL: ${{ secrets.ALT_AI_MODEL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.ALT_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ALT_CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.ALT_D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.ALT_KV_NAMESPACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Resolve config
        working-directory: ./mail-worker
        run: |
          set -e
          cp wrangler-action.toml wrangler-alt.toml
          sed -i '/\[\[routes\]\]/,/^$/d' wrangler-alt.toml
          sed -i '/\[\[r2_buckets\]\]/,/^$/d' wrangler-alt.toml
          sed -i "s|\${NAME}|${NAME}|g" wrangler-alt.toml
          sed -i "s|^database_name = .*|database_name = \"mk-7f3a9c\"|g" wrangler-alt.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-alt.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-alt.toml
          sed -i "s|\${PASSWORD}|${PASSWORD}|g" wrangler-alt.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-alt.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-alt.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-alt.toml
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" wrangler-alt.toml
          sed -i "s|\${ANALYSIS_CACHE}|false|g" wrangler-alt.toml
          sed -i "s|^project_link = .*|project_link = \"\"|g" wrangler-alt.toml
          python3 - <<'PY'
          p = 'wrangler-alt.toml'
          s = open(p).read()
          if 'nodejs_compat' not in s:
              s = s.replace('keep_vars = true', 'keep_vars = true\ncompatibility_flags = ["nodejs_compat"]', 1)
          open(p, 'w').write(s)
          PY
          sed -i '/\[build\]/,$d' wrangler-alt.toml
          sed -n '1,20p' wrangler-alt.toml

      - name: Frontend
        working-directory: ./mail-vue
        run: |
          pnpm install --frozen-lockfile
          sed -i "s|^VITE_PWA_NAME = .*|VITE_PWA_NAME = 'Vault'|" .env.release
          sed -i "s|^VITE_APP_TITLE = .*|VITE_APP_TITLE = 'Vault'|" .env.release
          pnpm run build

      - name: Rebrand
        working-directory: ./mail-worker
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Vault</title>', s, flags=re.S)
          s = re.sub(r'<meta name="description"[^>]*>', '', s)
          s = s.replace('alt="Cloud Mail"', 'alt="Vault"')
          p.write_text(s, encoding='utf-8')
          m = pathlib.Path('dist/manifest.webmanifest')
          if m.exists():
              t = m.read_text(encoding='utf-8')
              t = t.replace('Cloud Mail', 'Vault')
              m.write_text(t, encoding='utf-8')
          print('rebranded')
          PY

      - name: Deploy obfuscated
        id: deploy
        working-directory: ./mail-worker
        run: |
          set -e
          pnpm wrangler deploy --dry-run --outdir=./.bundle -c wrangler-alt.toml
          SRC=$(ls ./.bundle/*.js | head -1)
          echo "bundle=$SRC"
          npx --yes javascript-obfuscator@4.2.2 "$SRC" \
            --output ./.bundle/app.js \
            --compact true \
            --identifier-names-generator hexadecimal \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --string-array-rotate true \
            --string-array-shuffle true \
            --rename-globals false \
            --self-defending false \
            --dead-code-injection false \
            --control-flow-flattening false
          sed 's|main = "src/index.js"|main = ".bundle/app.js"|' wrangler-alt.toml > wrangler-alt-obf.toml
          pnpm wrangler deploy --no-bundle -c wrangler-alt-obf.toml 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "deployed=$URL"

      - name: Verify
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "target=$URL"
          CODE=$(curl -s -o /tmp/h -w "%{http_code}" -L --max-time 40 "$URL/" || echo 000)
          echo "home_status=$CODE"
          head -c 200 /tmp/h || true
          echo
          R=$(curl -s -w "|%{http_code}" --max-time 90 "$URL/api/init/${JWT_SECRET}" || echo "000")
          echo "init=$R"