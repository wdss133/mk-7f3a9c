name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NAME: ${{ secrets.NAME }}
      DOMAIN: ${{ secrets.DOMAIN }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
      ADMIN: ${{ secrets.ADMIN }}
      PASSWORD: ${{ secrets.PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies
        working-directory: ./mail-worker
        run: pnpm install --frozen-lockfile

      - name: Resolve config
        working-directory: ./mail-worker
        run: |
          set -e
          cp wrangler-action.toml wrangler-run.toml
          sed -i '/\[\[r2_buckets\]\]/,/^$/d' wrangler-run.toml
          sed -i "s|\${NAME}|${NAME}|g" wrangler-run.toml
          sed -i "s|\${CUSTOM_DOMAIN}|${CUSTOM_DOMAIN}|g" wrangler-run.toml
          sed -i "s|\"\${DOMAIN}\"|${DOMAIN}|g" wrangler-run.toml
          sed -i "s|\${ADMIN}|${ADMIN}|g" wrangler-run.toml
          sed -i "s|\${PASSWORD}|${PASSWORD}|g" wrangler-run.toml
          sed -i "s|\${JWT_SECRET}|${JWT_SECRET}|g" wrangler-run.toml
          sed -i "s|\${D1_DATABASE_ID}|${D1_DATABASE_ID}|g" wrangler-run.toml
          sed -i "s|\${KV_NAMESPACE_ID}|${KV_NAMESPACE_ID}|g" wrangler-run.toml
          sed -i "s|\${AI_MODEL}|${AI_MODEL}|g" wrangler-run.toml
          sed -i "s|\${ANALYSIS_CACHE}|false|g" wrangler-run.toml
          sed -i "s|^project_link = .*|project_link = \"\"|g" wrangler-run.toml
          python3 - <<'PY'
          p = 'wrangler-run.toml'
          s = open(p).read()
          if 'nodejs_compat' not in s:
              s = s.replace('keep_vars = true', 'keep_vars = true\ncompatibility_flags = ["nodejs_compat"]', 1)
          open(p, 'w').write(s)
          PY
          sed -n '1,22p' wrangler-run.toml
          sed -i '/\[build\]/,$d' wrangler-run.toml

      - name: Frontend
        working-directory: ./mail-vue
        run: |
          pnpm install --frozen-lockfile
          sed -i "s|^VITE_PWA_NAME = .*|VITE_PWA_NAME = 'Vault'|" .env.release
          sed -i "s|^VITE_APP_TITLE = .*|VITE_APP_TITLE = 'Vault'|" .env.release
          pnpm run build

      - name: Rebrand
        working-directory: ./mail-worker
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('dist/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<title>.*?</title>', '<title>Vault</title>', s, flags=re.S)
          s = re.sub(r'<meta name="description"[^>]*>', '', s)
          s = s.replace('alt="Cloud Mail"', 'alt="Vault"')
          p.write_text(s, encoding='utf-8')
          m = pathlib.Path('dist/manifest.webmanifest')
          if m.exists():
              t = m.read_text(encoding='utf-8')
              t = t.replace('Cloud Mail', 'Vault')
              m.write_text(t, encoding='utf-8')
          print('rebranded', len(s))
          PY

      - name: Deploy
        id: deploy
        working-directory: ./mail-worker
        run: |
          set -o pipefail
          pnpm wrangler deploy -c wrangler-run.toml 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then
            URL="https://${CUSTOM_DOMAIN}"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Verify
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "--- workers.dev ---"
          CODE=$(curl -s -o /tmp/h -w "%{http_code}" -L --max-time 30 "$URL/" || echo 000)
          echo "workers_status=$CODE"
          head -c 200 /tmp/h || true
          echo
          echo "--- custom domain ---"
          C=$(curl -s -o /tmp/h2 -w "%{http_code}" -L --max-time 30 "https://${CUSTOM_DOMAIN}/" || echo 000)
          echo "custom_status=$C"
          head -c 200 /tmp/h2 || true
          echo

      - name: Init database
        run: |
          echo "--- init via custom domain ---"
          R=$(curl -s -w "|%{http_code}" --max-time 90 "https://${CUSTOM_DOMAIN}/api/init/${JWT_SECRET}" || echo "000")
          echo "result=$R"

      - name: Summary
        if: always()
        run: echo "url=${{ steps.deploy.outputs.url }} domain=${CUSTOM_DOMAIN}"